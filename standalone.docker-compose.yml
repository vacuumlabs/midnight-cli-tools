services:
  proof-server:
    container_name: 'proof-server'
    image: 'midnightnetwork/proof-server:4.0.0'
    ports:
      - '6300:6300'
    environment:
      RUST_BACKTRACE: 'full'
    networks:
      - standalone-midnight-network
  node:
    image: 'midnightnetwork/midnight-node:0.12.0'
    container_name: 'node'
    ports:
      - '9944:9944'
      - '8080:8080'
    entrypoint: './midnight-node --dev --no-telemetry --no-prometheus --unsafe-rpc-external'
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9944/health" ]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 40s
    environment:
      CFG_PRESET: "dev"
      SHOW_SECRETS: "1"
      RUST_BACKTRACE: "full"
    depends_on:
      - proof-server
    networks:
      - standalone-midnight-network
  indexer:
    container_name: 'indexer'
    image: 'midnightntwrk/indexer-standalone:2.1.4'
    ports:
      - '8088:8088'
    environment:
      RUST_LOG: 'indexer=info,chain_indexer=info,indexer_api=info,wallet_indexer=info,indexer_common=info,fastrace_opentelemetry=off,info'
      APP__INFRA__SECRET: '303132333435363738393031323334353637383930313233343536373839303132'
      APP__INFRA__NODE__URL: 'ws://node:9944'
      LOG_LEVEL: 'DEBUG'
      RUST_BACKTRACE: "full"
    depends_on:
      node:
        condition: service_started
    networks:
      - standalone-midnight-network

networks:
  standalone-midnight-network:
    driver: bridge
